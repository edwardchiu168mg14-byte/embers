[package]
name = "embers-core"
description = "Detection and termination engine for Embers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }
